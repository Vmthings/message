<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Agent Dashboard</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; margin: 0; display: flex; height: 100vh; }
    #sidebar { width: 300px; background: #1e1e1e; padding: 15px; border-right: 1px solid #333; display: flex; flex-direction: column; }
    #main { flex: 1; display: flex; flex-direction: column; padding: 15px; }
    #canvas-container { flex: 1; background: #222; border-radius: 8px; position: relative; margin-bottom: 10px; }
    canvas { width: 100%; height: 100%; display: block; }
    #chat { height: 150px; background: #181818; border-radius: 8px; padding: 10px; overflow-y: auto; margin-bottom: 10px; font-family: monospace; }
    #input-box { display: flex; gap: 10px; }
    input { flex: 1; padding: 10px; background: #252525; border: 1px solid #444; color: #fff; border-radius: 4px; }
    button { padding: 10px 20px; background: #f55036; border: none; color: #fff; border-radius: 4px; cursor: pointer; }
    textarea { width: 100%; height: 150px; background: #252525; color: #a9dc76; border: 1px solid #444; font-family: monospace; resize: none; }
  </style>
</head>
<body>

<div id="sidebar">
  <h3>SKILL.md System Prompt</h3>
  <textarea id="skills">You are an autonomous AI agent. 
If user asks to draw on canvas, respond with:
Command: Draw [shape] [color]</textarea>
</div>

<div id="main">
  <div id="canvas-container">
    <canvas id="agentCanvas"></canvas>
  </div>
  <div id="chat"></div>
  <div id="input-box">
    <input type="text" id="userInput" placeholder="Ask agent something...">
    <button onclick="sendPrompt()">Send</button>
  </div>
</div>

<script>
  const WORKER_URL = 'https://groq-proxy.a765browne.workers.dev/';
  let history = [];

  const canvas = document.getElementById('agentCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;

  async function sendPrompt() {
    const input = document.getElementById('userInput');
    const chat = document.getElementById('chat');
    const prompt = input.value.trim();
    if (!prompt) return;

    chat.innerHTML += `<div><b>User:</b> ${prompt}</div>`;
    input.value = '';

    const systemPrompt = document.getElementById('skills').value;
    
    history.push({ role: 'user', content: prompt });

    try {
      const res = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'openai/gpt-oss-120b',
          messages: [{ role: 'system', content: systemPrompt }, ...history]
        })
      });

      const data = await res.json();
      const reply = data.choices[0].message.content;
      history.push({ role: 'assistant', content: reply });

      // Handle custom drawing command
      if (reply.includes('Command: Draw')) {
        handleDrawCommand(reply);
      }

      chat.innerHTML += `<div><b>AI:</b> ${reply}</div>`;
      chat.scrollTop = chat.scrollHeight;
    } catch (e) {
      chat.innerHTML += `<div style="color:red;">Error: ${e.message}</div>`;
    }
  }

  function handleDrawCommand(cmd) {
    ctx.fillStyle = '#ff5555';
    ctx.fillRect(50, 50, 100, 100);
  }
</script>

</body>
</html>
